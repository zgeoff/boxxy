# pnpm-style symlinked node_modules — no phantom dependencies
[install]
linker = "isolated"

# bun add saves exact versions, no ^/~ ranges
exact = true

# supply-chain guard: only install versions published >= 7 days ago
minimumReleaseAge = 604800

# first-party packages skip the gate; their third-party dependencies stay
# behind it. Renovate bumps first-party packages (@zgeoff, @impz, @pepys)
# as soon as they publish, so each one boxxy installs needs a
# permanent entry here by its full name, or bun install refuses the bump.
# @noslop/cli 0.4.30 (published 2026-11-17) ages past the gate ~2026-11-24 — remove then (audit-fix)
minimumReleaseAgeExcludes = [
  "@impz/client",
  "@impz/testing",
  "@noslop/cli",
  "@pepys/api",
  "@pepys/cli",
  "@pepys/contract",
  "@pepys/ingest",
  "@pepys/kit",
  "@pepys/kysely-turso",
  "@pepys/schema",
  "@pepys/source-github",
  "@pepys/source-telemetry",
  "@pepys/testing",
  "@wringer/core",
  "@wringer/gunshi",
  "@wringer/http",
  "@wringer/mcp",
  "@zgeoff/agent-hooks",
  "@zgeoff/bun-test-extended",
  "@zgeoff/chex",
  "@zgeoff/commitlint-config",
  "@zgeoff/diet",
  "@zgeoff/format-codemod",
  "@zgeoff/kysely-bun-sqlite",
  "@zgeoff/mcp-auth",
  "@zgeoff/oxfmt-config",
  "@zgeoff/oxlint-config",
  "@zgeoff/rig",
  "@zgeoff/skill-gate",
  "@zgeoff/std",
]

[test]
# registers the jest-extended matchers, seeds faker so a rerun of the same files gives the same
# test data, and answers GitHub requests from the MSW handlers
preload = [
  "@zgeoff/bun-test-extended",
  "./libs/model/src/test-utils/pin-faker-seed.ts",
  "./adapters/forge-github/src/test-utils/reset-mock-network.ts",
]
