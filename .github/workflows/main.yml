# Runs the shared Bun checks on every push to main, with the script list that
# the BUN_CHECK_SCRIPTS repo variable sets for pull requests, then releases the
# @boxxy/* packages through the shared release-please job, publishes each
# released package to npm, and attaches the CLI's binary to its GitHub release.
name: Main

on:
  push:
    branches: [main]
  # The publish run, which a push run dispatches at the release tag, and the
  # recovery path for a release that tagged but failed to publish: it skips
  # the release job and publishes the given package dirs after the checks
  # pass. A version npm holds already is skipped, so listing extra paths is
  # safe.
  workflow_dispatch:
    inputs:
      republish_paths:
        description: 'JSON array of package dirs to republish, e.g. ["libs/model"]'
        required: true
        type: string
      released_versions:
        description:
          'JSON object of the version the release tagged for each dir, e.g. {"libs/model":"0.2.0"};
          empty skips the check'
        required: false
        type: string
        default: ''

permissions:
  contents: read

# Each dispatched publish run, its checks and its publish together, waits in one queue, so releases
# publish in the order the push runs dispatched them; a queue on the publish job alone lets a run
# whose checks finish first publish a newer release before an older one. A push run gets a group
# of its own. queue: max keeps every waiting run, and no publish run cancels, so a release never
# stops halfway.
concurrency:
  group:
    ${{ github.event_name == 'workflow_dispatch' && 'publish' || format('main-{0}', github.run_id)
    }}
  cancel-in-progress: false
  queue: max

jobs:
  # A newer push makes an older run's checks moot. A dispatched publish run
  # gates its publish on these checks, and two dispatches can share a tag, so
  # each dispatch's checks get a group of their own and never cancel.
  checks:
    concurrency:
      group: checks-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'push' }}
    # GitHub checks the called workflow's job permissions even for its skipped
    # gitleaks job, which asks for pull-requests: write
    permissions:
      contents: read
      pull-requests: write
    uses: zgeoff/tools/.github/workflows/bun-checks.yml@6e6cd3a2f4f965ef6c2219503671012884182522 # main
    with:
      scripts: ${{ vars.BUN_CHECK_SCRIPTS }}
      # the pull request that landed the commits already scanned them
      gitleaks: false

  # A release takes two runs:
  # - Run 1, after a releasable commit lands on main: the shared release-please
  #   job opens or updates the release PR (version bumps and changelogs), and
  #   its sync command repairs the PR's lockfile and formatting. A maintainer
  #   merges the PR by hand, so merge stays off, and the run of that merge's
  #   push tags the release. The dispatch-publish job then starts run 2.
  # - Run 2, dispatched at the tag: the publish job ships each released
  #   package to npm through OIDC, after the checks of the tagged commit pass.
  #
  # The release job waits for no checks: the release PR passed its own, and
  # the tag must land while the merge commit is still main's head, as the
  # release App's token cannot tag a commit behind a workflow change. The
  # release waits for its one-time setup, which the RELEASE_ENABLED repo
  # variable marks done. Its queue keeps every waiting run; the default
  # replaces a waiting run, which would skip its release.
  release:
    if: github.event_name == 'push' && vars.RELEASE_ENABLED == 'true'
    concurrency:
      group: release
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      pull-requests: write
    uses: zgeoff/tools/.github/workflows/release-please.yml@6e6cd3a2f4f965ef6c2219503671012884182522 # main
    with:
      app-id: ${{ vars.RELEASE_APP_ID }}
      merge: false
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  # npm provenance names GITHUB_SHA as the source commit, and the signing
  # certificate binds the run's own commit, so a push run never publishes:
  # release-please can tag a merge that the run's commit does not hold. A
  # GITHUB_TOKEN workflow_dispatch starts a run, unlike its pushes, and the
  # run at the tag has the tagged commit as its github.sha.
  dispatch-publish:
    name: Dispatch the release publish
    needs: release
    if: needs.release.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # queue: max keeps every waiting dispatch; the default replaces a waiting
    # one, whose tagged release would then never publish.
    concurrency:
      group: dispatch-publish
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Dispatch publish at the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTPUTS: ${{ needs.release.outputs.release-outputs }}
        run: bun run --silent ci:dispatch-publish

  publish:
    name: Publish the release
    needs: checks
    if: github.event_name == 'workflow_dispatch' && vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # npm's trusted publishing takes the job's OIDC token, so no npm token
      # exists anywhere in this repository
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # npm does the publishing, not bun: trusted publishing (OIDC) needs
      # npm >= 11.5.1 — node 24 bundles at least 11.16 — and bun publish has
      # no OIDC support (oven-sh/bun#15601). Never upgrade the bundled npm in
      # place: a cross-major overlay prunes transitive deps that
      # libnpmpublish needs at publish time (sigstore).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Publish released packages
        env:
          PATHS_RELEASED: ${{ inputs.republish_paths }}
          RELEASED_VERSIONS: ${{ inputs.released_versions }}
        run: bun run --silent ci:publish-packages

  # An agent image downloads the CLI as a compiled binary, so a release of
  # @boxxy/cli attaches the binary, the hook plug-in archive and their
  # checksums to its GitHub release. A job of its own, so contents: write
  # never sits beside the publish job's OIDC token. The script skips a release
  # that holds the checksum file already, so a rerun never replaces a set that
  # an image may have pinned.
  cli-assets:
    name: Attach the CLI release assets
    needs: checks
    if: github.event_name == 'workflow_dispatch' && vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Build, check and attach the CLI assets
        env:
          GH_TOKEN: ${{ github.token }}
          PATHS_RELEASED: ${{ inputs.republish_paths }}
          RELEASED_VERSIONS: ${{ inputs.released_versions }}
        run: bun run --silent ci:release-cli-assets
